plugins { id 'com.android.application' }

android {
    namespace 'net.sonocraft.audio'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'net.sonocraft.audio'
        minSdk 24
        targetSdk 36
        versionCode 110
        versionName '0.4.0-mobile-preview.4'
        ndk { abiFilters.addAll((findProperty('sonocraftAbis') ?: 'arm64-v8a,x86_64').split(',')) }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DUniversalBinary=OFF', '-DSONOCRAFT_BUILD_TESTS=OFF'
                targets 'SonoBus_Standalone'
            }
        }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
        preview {
            initWith release
            debuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    sourceSets {
        preview.res.srcDirs += ['src/release/res']
        main.java.srcDirs += [
            '../../../../Source/android/java',
            '../../../../deps/juce/modules/juce_core/native/javacore/init',
            '../../../../deps/juce/modules/juce_core/native/javacore/app',
            '../../../../deps/juce/modules/juce_gui_basics/native/javaopt/app'
        ]
    }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
